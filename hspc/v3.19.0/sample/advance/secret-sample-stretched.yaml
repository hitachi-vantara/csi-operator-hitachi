# =============================================================================
# Hitachi Storage Plug-in for Containers (HSPC) - Stretched Secret (advanced)
# Kind: Secret, Name: secret-sample-stretched
# =============================================================================
#
# Purpose:
#   Stores the credentials that HSPC uses to connect to the primary and
#   secondary Hitachi storage systems for stretched PVCs (GAD and GAD with
#   adaptive data reduction), plus optional advanced parameters for:
#     - VSMs within resource groups       (primaryRSGId / secondaryRSGId)
#     - Host mode option support          (hostModeOptions)
#     - Parent-child clone enablement     (alternativeCloneMode)
#
# Prerequisites:
#   1. Supported storage systems: Hitachi VSP One Block and VSP family
#      storage systems that support GAD. alternativeCloneMode is supported
#      only on VSP One Block B85 and the VSP One Block B20 series.
#   2. The virtual serial number of the storage systems at the primary and
#      secondary sites is the same.
#   3. If the virtual serial numbers are identical, specify both
#      primaryRSGId and secondaryRSGId so that the resource groups are
#      identified correctly. If they differ, you can omit these IDs.
#   4. Remove any optional parameter that you do not need.
#   5. This is a reference manifest file and must be updated with applicable
#      values for your environment.
#      Before applying, replace the serial numbers, URLs, user names,
#      passwords, and resource group IDs with values for your environment.
#
# Notes:
#   • Values under "stringData" are plain text; Kubernetes encodes them when
#     the Secret is applied.
#   • If you have access to multiple virtual storage machines (VSMs),
#     specify the target VSM to use for creating the stretched PVC.
#   • Do not edit the VSM details of an existing Secret. Instead, create a
#     new Secret when you create a new stretched PVC.
#   • HSPC always sets host mode options 2, 7, 22, 25, 68, and 91.
#     hostModeOptions adds options to these defaults.
#   • With alternativeCloneMode: "true", HSPC creates a base (parent) volume
#     and a clone (child) volume. The clone is presented to the workload,
#     and the base volume is retained as the source. The setting applies
#     only to volumes created after it is enabled.
#
# Resource flow:
#   secret-sample-stretched --> sc-sample-stretched --> pvc-stretched-sample
#
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  # Secret name. Must match the Secret name referenced in the StorageClass.
  name: secret-sample-stretched
  # Namespace of the Secret. Must match the Secret namespace referenced in
  # the StorageClass.
  namespace: default
type: Opaque
stringData:
  # ---------------------------------------------------------------------------
  # Primary site storage system (required)
  # ---------------------------------------------------------------------------

  # Storage system serial number at the primary site.
  primarySerial: "111111"

  # Storage system REST API URL at the primary site.
  primaryURL: "https://172.16.0.1"

  # Storage system user name at the primary site.
  primaryUser: "primary-user"

  # Password of the storage system user at the primary site.
  primaryPassword: "primary-password"

  # ---------------------------------------------------------------------------
  # Secondary site storage system (required)
  # ---------------------------------------------------------------------------

  # Storage system serial number at the secondary site.
  secondarySerial: "222222"

  # Storage system REST API URL at the secondary site.
  secondaryURL: "https://172.16.0.2"

  # Storage system user name at the secondary site.
  secondaryUser: "secondary-user"

  # Password of the storage system user at the secondary site.
  secondaryPassword: "secondary-password"

  # ---------------------------------------------------------------------------
  # Virtual storage machine (required)
  # ---------------------------------------------------------------------------

  # Virtual storage system serial number. Must be the same at the primary
  # and secondary sites.
  virtualStorageSerialNumber: "333333"

  # ---------------------------------------------------------------------------
  # Resource group IDs - VSMs within resource groups (conditional)
  # ---------------------------------------------------------------------------

  # Primary resource group ID corresponding to the primary VSM.
  primaryRSGId: "1"

  # Secondary resource group ID corresponding to the secondary VSM.
  secondaryRSGId: "2"

  # ---------------------------------------------------------------------------
  # Host mode options (optional)
  # ---------------------------------------------------------------------------
  # Additional host mode options (HMOs) for the host groups or iSCSI targets
  # that HSPC creates, specified as comma-separated values.
  hostModeOptions: "81,88"

  # ---------------------------------------------------------------------------
  # Alternative clone mode - parent-child clone enablement (optional)
  # ---------------------------------------------------------------------------
  # Set to "true" to enable alternative clone mode.
  alternativeCloneMode: "true"
