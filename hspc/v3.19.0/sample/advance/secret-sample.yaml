# =============================================================================
# Hitachi Storage Plug-in for Containers (HSPC) - Secret (advanced)
# Kind: Secret, Name: secret-sample
# =============================================================================
#
# Purpose:
#   Stores the credentials that HSPC uses to connect to a Hitachi storage
#   system, plus optional advanced parameters for:
#     - Host mode option support          (hostModeOptions)
#     - Multiple resource group support   (resourceGroupID)
#     - Offline port migration            (portID / portIP)
#     - Parent-child clone enablement     (alternativeCloneMode)
#
# Prerequisites:
#   1. Supported storage systems: Hitachi VSP One Block and VSP family.
#      alternativeCloneMode is supported only on VSP One Block B85 and
#      the VSP One Block B20 series.
#   2. A storage system user with the permissions required by HSPC exists.
#   3. Remove any optional parameter that you do not need.
#   4. This is a reference manifest file and must be updated with applicable
#      values for your environment.
#      Before applying, replace url, user, and password with Base64-encoded
#      values for your environment, for example:
#        echo -n "https://172.16.1.1" | base64
#
# Notes:
#   • Values under "data" must be Base64-encoded. Values under "stringData"
#     are plain text; Kubernetes encodes them when the Secret is applied.
#   • HSPC always sets host mode options 2, 7, 22, 25, 68, and 91.
#     hostModeOptions adds options to these defaults.
#   • portID and portIP override the ports in the StorageClass so that
#     existing volumes are presented through new target ports.
#   • With alternativeCloneMode: "true", HSPC creates a base (parent) volume
#     and a clone (child) volume. The clone is presented to the workload,
#     and the base volume is retained as the source. This enables
#     expansion of the clone, re-creation of a clone from the same base
#     without recreating the original data, and simpler clone lifecycle
#     management on storage systems where a source volume cannot be deleted
#     while dependent clones exist.
#
# Resource flow:
#   secret-sample --> sc-sample / snapshotclass-sample --> PVC --> Pod
#
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  # Secret name. Must match the Secret name referenced in the StorageClass.
  name: secret-sample
  # Namespace of the Secret. Must match the Secret namespace referenced in
  # the StorageClass.
  namespace: default
type: Opaque
data:
  # ---------------------------------------------------------------------------
  # Storage system credentials (required)
  # ---------------------------------------------------------------------------

  # Base64-encoded storage system URL.
  #   - VSP One Block B85, VSP One Block B20 series: service IP address.
  #   - VSP 5000 series: IP address of the SVP.
  #   - VSP E series, VSP F350/F370/F700/F900, VSP G350/G370/G700/G900:
  #     IP address of the storage controller.
  url: aHR0cHM6Ly8xNzIuMTYuMS4x      # https://172.16.1.1

  # Base64-encoded storage system user name.
  user: VXNlcjAx                      # User01

  # Base64-encoded storage system user password.
  password: UGFzc3dvcmQwMQ==          # Password01

stringData:
  # ---------------------------------------------------------------------------
  # Host mode options (optional)
  # ---------------------------------------------------------------------------
  # Additional host mode options (HMOs) for the host groups or iSCSI targets
  # that HSPC creates, specified as comma-separated values.
  hostModeOptions: "81,88"

  # ---------------------------------------------------------------------------
  # Resource group ID - multiple resource group support (optional)
  # ---------------------------------------------------------------------------
  # ID of the resource group (virtual storage machine or tenant partition)
  # in which HSPC creates and manages volumes and host groups.
  # Required if the storage user has access to multiple resource groups.
  resourceGroupID: "1"

  # ---------------------------------------------------------------------------
  # Port ID / port IP - offline port migration (optional)
  # ---------------------------------------------------------------------------
  # Target port IDs (Fibre Channel or iSCSI), comma-separated.
  portID: CL3-A,CL4-A

  # Target iSCSI port IP addresses, comma-separated. Applies only when the
  # StorageClass connectionType is iscsi.
  portIP: 172.25.0.18,172.25.0.19

  # ---------------------------------------------------------------------------
  # Alternative clone mode - parent-child clone enablement (optional)
  # ---------------------------------------------------------------------------
  # Set to "true" to enable alternative clone mode.
  alternativeCloneMode: "true"
