# =============================================================================
# Hitachi Storage Plug-in for Containers (HSPC) - Stretched Secret (basic)
# Kind: Secret, Name: secret-sample-stretched
# =============================================================================
#
# Purpose:
#   Stores the credentials that HSPC uses to connect to the primary and
#   secondary Hitachi storage systems for stretched PVCs (GAD and GAD with
#   adaptive data reduction).
#
# Prerequisites:
#   1. Supported storage systems: Hitachi VSP One Block and VSP family
#      storage systems that support GAD.
#   2. The virtual serial number of the storage systems at the primary and
#      secondary sites is the same.
#   3. This is a reference manifest file and must be updated with applicable
#      values for your environment.
#      Before applying, replace the serial numbers, URLs, user names, and
#      passwords with values for your environment.
#
# Notes:
#   • Values under "stringData" are plain text; Kubernetes encodes them when
#     the Secret is applied.
#   • If you have access to multiple virtual storage machines (VSMs),
#     specify the target VSM to use for creating the stretched PVC.
#   • Do not edit the VSM details of an existing Secret. Instead, create a
#     new Secret when you create a new stretched PVC.
#
# Resource flow:
#   secret-sample-stretched --> sc-sample-stretched --> pvc-stretched-sample
#
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  # Secret name. Must match the Secret name referenced in the StorageClass.
  name: secret-sample-stretched
  # Namespace of the Secret. Must match the Secret namespace referenced in
  # the StorageClass.
  namespace: default
type: Opaque
stringData:
  # ---------------------------------------------------------------------------
  # Primary site storage system (required)
  # ---------------------------------------------------------------------------

  # Storage system serial number at the primary site.
  primarySerial: "111111"

  # Storage system REST API URL at the primary site.
  primaryURL: "https://172.16.0.1"

  # Storage system user name at the primary site.
  primaryUser: "primary-user"

  # Password of the storage system user at the primary site.
  primaryPassword: "primary-password"

  # ---------------------------------------------------------------------------
  # Secondary site storage system (required)
  # ---------------------------------------------------------------------------

  # Storage system serial number at the secondary site.
  secondarySerial: "222222"

  # Storage system REST API URL at the secondary site.
  secondaryURL: "https://172.16.0.2"

  # Storage system user name at the secondary site.
  secondaryUser: "secondary-user"

  # Password of the storage system user at the secondary site.
  secondaryPassword: "secondary-password"

  # ---------------------------------------------------------------------------
  # Virtual storage machine (required)
  # ---------------------------------------------------------------------------

  # Virtual storage system serial number. Must be the same at the primary
  # and secondary sites.
  virtualStorageSerialNumber: "333333"
