# =============================================================================
# Hitachi Storage Plug-in for Containers (HSPC) - Image Signature Verification Policy
# Kind: ClusterImagePolicy, Name: hitachi-cip
# =============================================================================
#
# Purpose:
#   Configures OpenShift Container Platform to verify the signatures of HSPC
#   images pulled from GitHub Container Registry (ghcr.io) by using the
#   Hitachi Vantara public key.
#
# Prerequisites:
#   1. Supported platform: OpenShift Container Platform with the
#      ClusterImagePolicy API (config.openshift.io/v1) available.
#   2. Applying a ClusterImagePolicy triggers a rolling update of the
#      MachineConfigPools, and nodes may reboot. Schedule the change in a
#      maintenance window.
#   3. This is a reference manifest file and must be updated with applicable
#      values for your environment.
#      Before applying:
#        a. Download the Hitachi Vantara public key (HV_PK.pem) from
#           https://github.com/hitachi-vantara/csi-operator-hitachi/tree/main/digital_signature
#        b. Encode the key and paste the output into publicKey.keyData:
#             base64 -w0 HV_PK.pem
#        c. If you mirror the images to a private registry, update scopes
#           to the mirror location.
#
# Notes:
#   • Images in the listed scopes that are not signed with the Hitachi
#     Vantara key are rejected by the nodes.
#   • matchPolicy: MatchRepository accepts a signature whose identity
#     matches the repository of the image, regardless of the tag.
#   • ClusterImagePolicy is cluster-scoped, so no namespace is set.
#
# Resource flow:
#   HV_PK.pem --> hitachi-cip --> MachineConfigPools --> node image
#   verification for ghcr.io/hitachi-vantara/hitachicsi-oci-oss/
#
# =============================================================================

apiVersion: config.openshift.io/v1
kind: ClusterImagePolicy
metadata:
  # Name of the policy.
  name: hitachi-cip
spec:
  # Image repositories covered by this policy (ghcr.io).
  scopes:
    - ghcr.io/hitachi-vantara/hitachicsi-oci-oss/hspc-operator
    - ghcr.io/hitachi-vantara/hitachicsi-oci-oss/hspc-config-operator
    - ghcr.io/hitachi-vantara/hitachicsi-oci-oss/hspc-csi-driver
    - ghcr.io/hitachi-vantara/hitachicsi-oci-oss/hspc-csi-telemetry-service
    # Below repositories required for HitachiCSI Console UI Plugin
    - ghcr.io/hitachi-vantara/hitachicsi-oci-oss/hv-ocp-ui
    - ghcr.io/hitachi-vantara/hitachicsi-oci-oss/hv-ocp-bff
  policy:
    rootOfTrust:
      # Signatures are verified against a public key.
      policyType: PublicKey
      publicKey:
        # Base64-encoded Hitachi Vantara public key (base64 -w0 HV_PK.pem).
        keyData: 
    signedIdentity:
      # Accepts signatures whose identity matches the image repository.
      matchPolicy: MatchRepository
